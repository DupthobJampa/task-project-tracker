<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Task Tracker</h1>
        <p class="demo-note">Public demo — projects and tasks are shared between all visitors.</p>
        <button id="new-project-button">New Project</button>
    </header>

    <main>
        <aside>
            <h2>Projects</h2>

            <form id="project-form" class="project-form hidden">
                <input
                    id="project-name"
                    type="text"
                    placeholder="Project name"
                    required
                >

                <textarea
                    id="project-description"
                    placeholder="Description"
                ></textarea>

                <button type="submit">Create Project</button>
            </form>

            <ul class="project-list"></ul>
        </aside>

        <section>
            <div class="task-header">
                <div>
                    <h2>Tasks</h2>
                </div>

                <div class="project-actions">
                    <button id="add-task-button">Add Task</button>
                    <button id="delete-project-button">Delete Project</button>
                </div>

            </div>

            <div class="filters">
                <button class="filter-button active" data-filter="all">All</button>
                <button class="filter-button" data-filter="todo">Todo</button>
                <button class="filter-button" data-filter="in_progress">In Progress</button>
                <button class="filter-button" data-filter="completed">Completed</button>
            </div>

            <form id="task-form" class="task-form hidden">
                <div class="task-form-text">
                    <input
                        id="task-title"
                        type="text"
                        placeholder="Task title"
                        required
                    >

                    <textarea
                        id="task-description"
                        placeholder="Description"
                    ></textarea>
                </div>

                <div class="task-form-options">
                    <select id="task-status">
                        <option value="todo">Todo</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>

                    <select id="task-priority">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>

                    <input id="task-due-date" type="date">
                    <button id="task-submit-button" type="submit">Create Task</button>
                    <button id="cancel-edit-button" type="button" class="hidden">Cancel</button>
                </div>
            </form>

            <div class="task-list"></div>
        </section>
    </main>
<script src="script.js"></script>
</body>
</html>
