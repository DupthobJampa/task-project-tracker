<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <h1>Task Tracker</h1>
        <button>New Project</button>
    </header>

    <main>
        <aside>
            <h2>Projects</h2>
            <ul class="project-list">
                <li class="active">Internship Preparation</li>
                <li>University</li>
                <li>Personal</li>
            </ul>
        </aside>

        <section>
            <div class="task-header">
                <h2>Internship Preparation</h2>
                <button>Add Task</button>
            </div>

            <div class="filters">
                <button class="filter-button active" data-filter="all">All</button>
                <button class="filter-button" data-filter="todo">Todo</button>
                <button class="filter-button" data-filter="in_progress">In Progress</button>
                <button class="filter-button" data-filter="completed">Completed</button>
            </div>

            <div class="task-list">
                <article class="task" data-status="todo">
                    <h3>Update resume</h3>
                    <div class ="task-info">
                        <span class="status">Todo</span>
                        <span class="priority">High Priority</span>
                    </div>
                </article>

                <article class="task" data-status="in_progress">
                    <h3>Practice LeetCode</h3>
                    <div class="task-info">
                        <span class="status">In Progress</span>
                        <span class="priority">Medium Priority</span>
                    </div>
                </article>
            </div>
        </section>
    </main>
<script src="script.js"></script>
</body>
</html>
