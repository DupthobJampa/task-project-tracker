<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Task Tracker</h1>
        <button>New Project</button>
    </header>

    <main>
        <aside>
            <h2>Projects</h2>
            <ul class="project-list"></ul>
        </aside>

        <section>
            <div class="task-header">
                <h2>Internship Preparation</h2>
                <button id = "add-task-button">Add Task</button>
            </div>

            <div class="filters">
                <button class="filter-button active" data-filter="all">All</button>
                <button class="filter-button" data-filter="todo">Todo</button>
                <button class="filter-button" data-filter="in_progress">In Progress</button>
                <button class="filter-button" data-filter="completed">Completed</button>
            </div>

            <form id="task-form" class="task-form hidden">
                <input id="task-title" type="text" placeholder="Task title" required>
                <select id="task-status">
                    <option value="todo">Todo</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>

                <select id="task-priority">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>

                <input id="task-due-date" type="date">

                <button type="submit">Create Task</button>
            </form>

            <div class="task-list"></div>
        </section>
    </main>
<script src="script.js"></script>
</body>
</html>
