<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <h1>Task Tracker</h1>
        <button>New Project</button>
    </header>

    <main>
        <aside>
            <h2>Projects</h2>
            <ul class="project-list">
                <li>Internship Preparation</li>
                <li>University</li>
                <li>Personal</li>
            </ul>
        </aside>

        <section>
            <div class="task-header">
                <h2>Internship Preparation</h2>
                <button>Add Task</button>
            </div>

            <div class="filters">
                <button>All</button>
                <button>Todo</button>
                <button>In Progress</button>
                <button>Completed</button>
            </div>

            <div class="task-list">
                <article class="task">
                    <h3>Update resume</h3>
                    <p>Status: Todo</p>
                    <p>Priority: High</p>
                </article>

                <article class="task">
                    <h3>Practice LeetCode</h3>
                    <p>Status: In Progress</p>
                    <p>Priority: Medium</p>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
